version: '2'

run:
  timeout: 5m
  tests: false
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - bodyclose
    - unconvert
    - misspell
    - unused
    - ineffassign
    - sqlclosecheck
    - staticcheck
    - gocritic
    - errorlint
    - errcheck

  settings:
    errcheck:
      # excelize cell/style setters only fail on an invalid cell reference or
      # sheet name, which the export builder generates itself.
      exclude-functions:
        - (*github.com/xuri/excelize/v2.File).SetCellValue
        - (*github.com/xuri/excelize/v2.File).SetCellStyle
        - (*github.com/xuri/excelize/v2.File).SetSheetName
        - (*github.com/xuri/excelize/v2.File).SetPanes
        - (*github.com/xuri/excelize/v2.File).AutoFilter
    govet:
      disable:
        - printf
        - copylocks

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/javaknight1/servicepro

output:
  formats:
    colored-line-number: {}
