  # ============================================================================
  # Invoice Endpoints
  # ============================================================================

  /invoices:
    get:
      tags:
        - Invoices
      summary: List invoices
      description: Returns a paginated list of invoices with optional filtering.
      operationId: listInvoices
      parameters:
        - name: customer_id
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - name: from_date
          in: query
          description: Filter from issue date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          description: Filter to issue date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: min_amount
          in: query
          schema:
            type: number
        - name: max_amount
          in: query
          schema:
            type: number
        - name: is_overdue
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          description: Search invoice number or notes
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Invoices
      summary: Create invoice
      description: |
        Creates a new invoice.

        A unique invoice number will be auto-generated in the format `INV-YYYY-XXXX`.
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /invoices/{id}:
    get:
      tags:
        - Invoices
      summary: Get invoice
      description: Returns a single invoice by ID.
      operationId: getInvoice
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Invoices
      summary: Update invoice
      description: Updates an existing invoice.
      operationId: updateInvoice
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdate'
      responses:
        '200':
          description: Invoice updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Invoices
      summary: Delete invoice
      description: Deletes a draft invoice.
      operationId: deleteInvoice
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Invoice deleted
        '400':
          description: Cannot delete non-draft invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invoices/{id}/send:
    post:
      tags:
        - Invoices
      summary: Send invoice
      description: |
        Sends an invoice to the customer via email.

        **Status Transition:** `draft` -> `sent`
      operationId: sendInvoice
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Invoice sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          description: Invoice cannot be sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invoices/{id}/payments:
    post:
      tags:
        - Invoices
      summary: Record payment
      description: Records a payment against an invoice.
      operationId: recordPayment
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          description: Invalid payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_PAYMENT
                  message: 'Payment amount exceeds amount due'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invoices/{id}/cancel:
    post:
      tags:
        - Invoices
      summary: Cancel invoice
      description: Cancels an invoice.
      operationId: cancelInvoice
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCancelRequest'
      responses:
        '200':
          description: Invoice cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          description: Cannot cancel invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # Quote Endpoints
  # ============================================================================

  /quotes:
    get:
      tags:
        - Quotes
      summary: List quotes
      description: |
        Returns a paginated list of quotes with optional filtering.

        **Required Permission:** `quotes.list`
      operationId: listQuotes
      parameters:
        - name: customer_id
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/QuoteStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: List of quotes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Quotes
      summary: Create quote
      description: |
        Creates a new quote.

        **Required Permission:** `quotes.create`

        A unique quote number will be auto-generated in the format `QUO-YYYY-XXXX`.
      operationId: createQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreate'
      responses:
        '201':
          description: Quote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /quotes/{id}:
    get:
      tags:
        - Quotes
      summary: Get quote
      description: |
        Returns a single quote by ID.

        **Required Permission:** `quotes.read`
      operationId: getQuote
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Quote details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Quotes
      summary: Update quote
      description: |
        Updates an existing quote. Only `draft` and `sent` quotes can be edited.

        **Required Permission:** `quotes.update`
      operationId: updateQuote
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteUpdate'
      responses:
        '200':
          description: Quote updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Quotes
      summary: Delete quote
      description: |
        Deletes a quote. Only `draft` quotes can be deleted.

        **Required Permission:** `quotes.delete`
      operationId: deleteQuote
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Quote deleted
        '400':
          description: Cannot delete non-draft quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotes/number/{quoteNumber}:
    get:
      tags:
        - Quotes
      summary: Get quote by number
      description: |
        Returns a quote by its quote number.

        **Required Permission:** `quotes.read`
      operationId: getQuoteByNumber
      parameters:
        - name: quoteNumber
          in: path
          required: true
          description: Quote number (e.g., QUO-2024-0001)
          schema:
            type: string
      responses:
        '200':
          description: Quote details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotes/{id}/send:
    post:
      tags:
        - Quotes
      summary: Send quote
      description: |
        Sends a quote to the customer via email.

        **Required Permission:** `quotes.update`

        **Status Transition:** `draft` -> `sent`
      operationId: sendQuote
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Quote sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Quote cannot be sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotes/{id}/accept:
    post:
      tags:
        - Quotes
      summary: Accept quote
      description: |
        Marks a quote as accepted.

        **Required Permission:** `quotes.update`

        **Status Transition:** `sent` | `viewed` -> `accepted`
      operationId: acceptQuote
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Quote accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotes/{id}/reject:
    post:
      tags:
        - Quotes
      summary: Reject quote
      description: |
        Marks a quote as declined.

        **Required Permission:** `quotes.update`

        **Status Transition:** `sent` | `viewed` -> `declined`
      operationId: rejectQuote
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Quote declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotes/stats:
    get:
      tags:
        - Quotes
      summary: Get quote statistics
      description: |
        Returns quote statistics including counts by status and conversion rate.

        **Required Permission:** `quotes.list`
      operationId: getQuoteStats
      responses:
        '200':
          description: Quote statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
