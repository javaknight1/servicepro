        only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.InviteCode'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List invite codes
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Creates a platform invite code for invite-only registration. The
        plaintext code is returned once. Platform super admins only.
      parameters:
      - description: Invite code options
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.CreateInviteCodeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.CreateInviteCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create invite code
      tags:
      - Admin
  /admin/invite-codes/{id}:
