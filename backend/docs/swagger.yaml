            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "404":
          description: Job not found
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "409":
          description: The job already has 100 attachments (attachment_limit)
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "413":
          description: Larger than 15 MB (file_too_large)
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "415":
          description: Not a JPEG, PNG, WebP or PDF (unsupported_file_type)
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Attach a photo or file to a job
      tags:
      - jobs
