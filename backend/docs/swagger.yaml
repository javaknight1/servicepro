      description: 'Multipart upload (field "file", optional "caption"), at most 15
        MB. The type is sniffed from the bytes: JPEG, PNG and WebP photos are re-encoded
        as JPEG (EXIF stripped, orientation applied, longest side 2048 px) with a
        400 px thumbnail; PDFs are stored as uploaded. Photos declaring more than
        12000 px a side or 40 megapixels are refused before decoding. Technicians
        can attach only to jobs assigned to them; other jobs are 404. A job holds
        at most 100 attachments.'
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      - description: Photo (JPEG, PNG, WebP) or PDF
        in: formData
        name: file
        required: true
        type: file
      - description: Caption, up to 500 characters
        in: formData
