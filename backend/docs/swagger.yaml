  /internal/jobs/imports:
    post:
      description: 'Internal job endpoint (auth: X-Internal-Jobs-Token header = INTERNAL_JOBS_SECRET;
        404 when the secret is unset). Runs queued imports (customer CSV template
        and mapped Jobber/Housecall Pro/CSV imports) for every tenant: each job is
        claimed atomically (pending → processing, FOR UPDATE SKIP LOCKED) before it
        runs, so overlapping runs never import a job twice; each job imports into
        its own tenant only. Imports run in chunks: a job not finished when the pass
        ends (40 s) goes back to pending and continues on the next call. A job stuck
        in processing for 5 minutes resumes from its saved cursor (mapped imports,
        up to 3 attempts) or is marked failed (customer-template imports). Runs up
        to 20 jobs per call. Mounted at the server root (/internal/jobs/imports),
        outside /api.'
      parameters:
      - description: Internal jobs secret
        in: header
        name: X-Internal-Jobs-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers.ImportsJobResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
