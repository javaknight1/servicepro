    get:
      description: 'The sign-off (null when the job hasn''t been signed) with a presigned
        link to the signature, whether and to whom the service report was emailed,
        and suggested_recipients: who the report goes to (the customer''s email and
        the site contact unless the customer opted out of email, and the signer''s
        email).'
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.JobSignoffEnvelope'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "404":
          description: Job not found
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a job's customer sign-off
      tags:
      - jobs
    post:
      consumes:
      - application/json
      description: 'The customer signs on the technician''s phone: signer name (optional
        title and email) and the signature as a PNG data URL. The type is sniffed
        from the bytes (PNG only), at most 512 KB and 100 x 40 to 3000 x 3000 pixels
        (checked before decoding); a canvas without ink is refused. The visit must
        be started or done (409 job_not_started). Signing again replaces the sign-off
        until the service report has been emailed, then it is locked (409 signoff_locked).
        The time, IP and device are recorded. Technicians can sign off only jobs assigned
        to them; other jobs are 404.'
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      - description: Signer and signature
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.CaptureJobSignoffRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.JobSignoffResponse'
        "400":
          description: Invalid request, unreadable signature (invalid_signature),
            wrong size (signature_dimensions), empty canvas (signature_empty)
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "404":
          description: Job not found
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "409":
          description: Visit not started (job_not_started) or report already emailed
            (signoff_locked)
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "413":
          description: Signature over 512 KB (signature_too_large)
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "415":
          description: Not a PNG (unsupported_signature_type)
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
