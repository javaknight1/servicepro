            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a consolidated invoice
      tags:
      - invoices
  /invoices/consolidate/preview:
    get:
      description: The lines and totals POST /invoices/consolidate would create for
        one customer and period, without writing anything (T188). Monthly agreements
        bill price_per_period once per calendar month the period touches; per-visit
        agreements bill completed visits in the period × price; each completed extra-work
        job finished by the end of the period is its own line with its approval. Work
        already billed is left out. Dates are the tenant's local calendar dates, inclusive.
