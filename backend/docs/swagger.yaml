  /api/v1/jobs/{id}/invoice:
    post:
      description: 'Creates a draft invoice from a completed job and moves the job
        to invoiced, all in one transaction (T029). Lines are built by the server
        (T030): a job converted from a quote bills the quote''s lines (and links the
        quote); otherwise labor = actual time on site (actual start/end, else actual
        duration) × the tenant''s laborRate setting, or — no rate or no time recorded
        — one line for the job''s amount (total, else actual cost, else estimate);
        then each billable material at its unit cost. Lines carry the job''s site
        name; the job''s completion notes and non-internal notes become the invoice
        notes; the customer''s default PO and the tenant''s default payment term and
        tax rate apply; totals are computed server-side. Idempotent: a job is invoiced
        once — a second (or concurrent) call answers 409 already_invoiced with the
        existing invoice''s ID in resource_id, including when a consolidated invoice
        billed the job. 409 job_not_completed for other statuses; 409 agreement_visit
        for agreement visits (billed on the consolidated invoice).'
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.Invoice'
        "400":
          description: Invalid job ID
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "403":
          description: Missing invoices.create permission
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "404":
          description: Job not found
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "409":
          description: Not completed, an agreement visit, or already invoiced (resource_id
            = the invoice)
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate the invoice for a completed job
      tags:
      - jobs
