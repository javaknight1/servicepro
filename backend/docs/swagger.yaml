        the period (see the preview), a line per site per agreement plus extra work,
        with the customer''s default PO, and moves the included jobs to invoiced —
        all in one transaction (T188). Each month, visit and job is billed once: work
        already on another invoice is skipped; 409 nothing_to_invoice when nothing
        is left, 409 already_invoiced when a concurrent request billed some of it
        first. Cancelling or deleting the invoice releases the work.'
