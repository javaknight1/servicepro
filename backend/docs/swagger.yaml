host: localhost:8080
info:
  contact:
    email: support@sharkfins.xyz
    name: ServicePro Support
  description: |-
    ServicePro is a field service management platform for service businesses.
    This API provides endpoints for managing customers, jobs, quotes, invoices, and more.
  license:
    name: Proprietary
  title: ServicePro API
  version: "1.0"
paths:
  /admin/invite-codes:
    get:
      description: Lists platform invite codes, newest first. Platform super admins
        only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.InviteCode'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List invite codes
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Creates a platform invite code for invite-only registration. The
        plaintext code is returned once. Platform super admins only.
      parameters:
      - description: Invite code options
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.CreateInviteCodeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.CreateInviteCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create invite code
      tags:
      - Admin
  /admin/invite-codes/{id}:
    delete:
      description: Revokes a platform invite code. Platform super admins only.
      parameters:
      - description: Invite code ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke invite code
      tags:
      - Admin
  /api/v1/agreements:
    get:
      description: The account's service agreements, newest first; filter by customer,
        site or status.
      parameters:
      - description: Customer ID
        in: query
        name: customer_id
        type: string
      - description: Site ID
        in: query
        name: site_id
        type: string
      - description: active or paused
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.AgreementListResponse'
        "400":
          description: Invalid filter
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List service agreements
      tags:
      - agreements
    post:
      consumes:
      - application/json
      description: 'Recurring work at one of the customer''s sites: frequency (weekdays,
        weekly on given weekdays, N times a week, monthly on a day), start/end dates,
        local visit start time, price per month or visit, optional technician. Visits
        are generated as scheduled jobs up to 14 days ahead.'
      parameters:
      - description: Agreement
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.CreateAgreementRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.AgreementResponse'
        "400":
          description: Invalid request, or the site isn't the customer's
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "404":
          description: Customer or technician not found
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a service agreement
      tags:
      - agreements
  /api/v1/agreements/{id}:
    delete:
      description: Soft-deletes the agreement; jobs it generated stay.
      parameters:
      - description: Agreement ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "404":
          description: Agreement not found
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a service agreement
      tags:
      - agreements
    get:
      parameters:
      - description: Agreement ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.AgreementResponse'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "404":
          description: Agreement not found
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a service agreement
      tags:
      - agreements
    put:
      consumes:
      - application/json
      description: Changes the fields present in the body. Visits already generated
        (the next 14 days) keep their jobs.
      parameters:
      - description: Agreement ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.UpdateAgreementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.AgreementResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "404":
          description: Agreement or technician not found
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a service agreement
