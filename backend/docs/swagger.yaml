  /api/v1/quotes/{id}/convert-to-job:
    post:
      consumes:
      - application/json
      description: 'Creates a job (status new, ready to schedule) from an accepted
        quote in one transaction: the quote''s customer, the optional site (its address
        becomes the service address, else the customer''s billing address), the quote''s
        line items and notes in the description, and its subtotal as the estimated
        cost. The job links back to the quote (quote_id); GET /quotes/{id} then returns
        job_id. A quote converts once: a second call answers 409 already_converted
        with the job''s ID in resource_id. 409 quote_not_accepted for any other status;
        409 already_invoiced when the quote was invoiced directly. When the job is
        invoiced (POST /jobs/{id}/invoice) its lines come from the quote.'
      parameters:
      - description: Quote ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional title, job type and site
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ConvertQuoteToJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.JobResponse'
        "400":
          description: Invalid request, or the site isn't one of the customer's
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "403":
          description: Missing jobs.create permission
          schema:
            $ref: '#/definitions/github_com_javaknight1_servicepro_backend_internal_models.ErrorResponse'
        "404":
          description: Quote not found
          schema:
