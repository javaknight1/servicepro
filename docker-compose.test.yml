# =============================================================================
# Docker Compose Configuration for Integration Testing
# =============================================================================
# Usage:
#   Start:   docker compose -f docker-compose.test.yml up -d
#   Stop:    docker compose -f docker-compose.test.yml down -v
#   Logs:    docker compose -f docker-compose.test.yml logs -f
#   Run tests: docker compose -f docker-compose.test.yml run --rm test-runner
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Test Database (PostgreSQL)
  # ---------------------------------------------------------------------------
  test-postgres:
    image: postgres:16-alpine
    container_name: servicepro-test-postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: servicepro_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data # Use tmpfs for faster tests
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d servicepro_test']
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - test-network

  # ---------------------------------------------------------------------------
  # Test Redis
  # ---------------------------------------------------------------------------
  test-redis:
    image: redis:7-alpine
    container_name: servicepro-test-redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - test-network

  # ---------------------------------------------------------------------------
  # Mock Stripe Server (using stripe-mock)
  # ---------------------------------------------------------------------------
  stripe-mock:
    image: stripe/stripe-mock:latest
    container_name: servicepro-stripe-mock
    ports:
      - '12111:12111' # HTTP
      - '12112:12112' # HTTPS
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '--spider', 'http://localhost:12111/v1/customers']
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - test-network

  # ---------------------------------------------------------------------------
  # Mock AWS Services (LocalStack)
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:latest
    container_name: servicepro-localstack
    environment:
      SERVICES: s3,ses,sns,sqs
      DEBUG: 0
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '4566:4566' # All LocalStack services
    volumes:
      - ./backend/tests/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-network

  # ---------------------------------------------------------------------------
  # MailHog for Email Testing
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: servicepro-mailhog
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--spider',
          'http://localhost:8025/api/v2/messages',
        ]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - test-network

  # ---------------------------------------------------------------------------
  # Backend Test Runner
  # ---------------------------------------------------------------------------
  test-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: servicepro-test-runner
    environment:
      # Database
      DATABASE_URL: postgresql://test_user:test_password@test-postgres:5432/servicepro_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://test_user:test_password@test-postgres:5432/servicepro_test?sslmode=disable

      # Redis
      REDIS_URL: redis://test-redis:6379

      # Stripe Mock
      STRIPE_API_KEY: sk_test_mock_key
      STRIPE_WEBHOOK_SECRET: whsec_test_secret
      STRIPE_API_BASE: http://stripe-mock:12111

      # AWS/LocalStack
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1

      # Email (MailHog)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAILHOG_API: http://mailhog:8025

      # Test Configuration
      ENV: test
      JWT_SECRET: test-jwt-secret-for-integration-tests
      LOG_LEVEL: debug
      TEST_MODE: 'true'
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      stripe-mock:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    working_dir: /app
    command:
      [
        'go',
        'test',
        '-v',
        '-tags=integration',
        '-count=1',
        './tests/integration/...',
      ]
    networks:
      - test-network

  # ---------------------------------------------------------------------------
  # Backend API Server (for E2E tests)
  # ---------------------------------------------------------------------------
  test-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servicepro-test-api
    environment:
      DATABASE_URL: postgresql://test_user:test_password@test-postgres:5432/servicepro_test?sslmode=disable
      REDIS_URL: redis://test-redis:6379
      STRIPE_API_KEY: sk_test_mock_key
      STRIPE_WEBHOOK_SECRET: whsec_test_secret
      STRIPE_API_BASE: http://stripe-mock:12111
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      ENV: test
      PORT: 8080
      JWT_SECRET: test-jwt-secret-for-integration-tests
    ports:
      - '8081:8080'
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  go-mod-cache:
