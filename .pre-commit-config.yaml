repos:
  # Conventional commit message validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            major,
            minor,
            feat,
            fix,
            perf,
            docs,
            refactor,
            test,
            chore,
            ci,
            style,
            build,
          ]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
        exclude: |
          (?x)^(
            .*/templates/.*\.yaml|
            .*/templates/.*\.yml
          )$
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Prettier for formatting (with auto-stage, uses project's prettier version)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'frontend/node_modules/.bin/prettier --write "$@" && git add "$@"' --
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css, scss]
        exclude: |
          (?x)^(
            package-lock\.json|
            yarn\.lock|
            pnpm-lock\.yaml|
            .*/templates/.*\.yaml|
            .*/templates/.*\.yml
          )$

  # Frontend - ESLint (uses centralized Makefile target)
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: make frontend-lint-fix
        language: system
        pass_filenames: false
        files: ^frontend/.*\.[jt]sx?$

  # Frontend - Dead code detection
  - repo: local
    hooks:
      - id: dead-code
        name: Dead Code Detection
        entry: bash -c 'cd frontend && npm run dead-code'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$

  # Backend - Go linting (uses centralized Makefile target)
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: make backend-lint
        language: system
        pass_filenames: false
        files: ^backend/.*\.go$

  # Go formatting
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        args: [-w]
      - id: go-imports
        args: [-w, -local, github.com/javaknight1/servicepro]

  # Frontend unit tests
  - repo: local
    hooks:
      - id: frontend-tests
        name: Frontend Tests
        entry: bash -c 'cd frontend && npm test -- --run --passWithNoTests'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js|jsx)$

  # Backend unit tests
  - repo: local
    hooks:
      - id: backend-tests
        name: Backend Tests
        entry: bash -c 'cd backend && go test -race -timeout 5m ./... -skip "Integration"'
        language: system
        pass_filenames: false
        files: ^backend/.*\.go$
