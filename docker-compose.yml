services:
  postgres:
    image: postgres:16-alpine
    container_name: servicepro-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: servicepro
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: servicepro-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: servicepro-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: servicepro-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/servicepro-uploads --ignore-existing;
      mc anonymous set download myminio/servicepro-uploads;
      exit 0;
      "

  backend:
    image: golang:1.24-alpine
    container_name: servicepro-backend
    working_dir: /app
    ports:
      - '8080:8080'
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/servicepro?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - ENV=development
      - FRONTEND_URL=http://localhost:3000
      # S3-compatible storage (MinIO)
      - S3_COMPATIBLE_ENDPOINT=http://minio:9000
      - S3_COMPATIBLE_BUCKET=servicepro-uploads
      - S3_COMPATIBLE_REGION=us-east-1
      - S3_COMPATIBLE_ACCESS_KEY_ID=minioadmin
      - S3_COMPATIBLE_SECRET_ACCESS_KEY=minioadmin
      - S3_COMPATIBLE_USE_PATH_STYLE=true
      - S3_COMPATIBLE_DISABLE_SSL=true
      - S3_COMPATIBLE_PUBLIC_URL=http://localhost:9000/servicepro-uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    command: go run cmd/main.go

  frontend:
    image: node:22-alpine
    container_name: servicepro-frontend
    working_dir: /app
    ports:
      - '3000:3000'
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=ws://localhost:8080/ws
      - VITE_PROXY_TARGET=http://backend:8080
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  go-mod-cache:
