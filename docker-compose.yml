services:
  postgres:
    image: postgres:18-alpine
    container_name: servicepro-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: servicepro
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory (/var/lib/postgresql/18/docker),
      # so mount the parent. New volume name: the old postgres_data (16) volume is not compatible.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: servicepro-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: servicepro-mailpit
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025/api/v1/info']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # FIXME: minio/minio and minio/mc are no longer publicly pullable from
    # Docker Hub (registry answers UNAUTHORIZED as of 2026-10), so there is no
    # tag to pin. Existing local caches keep working; fresh machines need a
    # replacement S3 emulator (or a dev R2 bucket) — see README.
    image: minio/minio:latest
    container_name: servicepro-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: servicepro-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/servicepro-uploads --ignore-existing;
      mc anonymous set download myminio/servicepro-uploads;
      exit 0;
      "

  backend:
    # Keep the minor in step with the `go` line in backend/go.mod.
    image: golang:1.26-alpine
    container_name: servicepro-backend
    working_dir: /app
    ports:
      - '8080:8080'
    env_file:
      - ./backend/.env
    environment:
      # Override specific vars for Docker networking
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/servicepro?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - ENV=development
      # Local dev self-migrates and runs the in-process tickers. Production
      # sets both to false: the release `migrate` job owns migrations and
      # .github/workflows/scheduled-jobs.yml drives /internal/jobs/*.
      - RUN_MIGRATIONS_ON_STARTUP=true
      - RUN_BACKGROUND_WORKERS=true
      - APP_VERSION=${APP_VERSION:-dev}
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:8080
      # S3-compatible storage (MinIO)
      - S3_COMPATIBLE_ENDPOINT=http://minio:9000
      - S3_COMPATIBLE_BUCKET=servicepro-uploads
      - S3_COMPATIBLE_REGION=us-east-1
      - S3_COMPATIBLE_ACCESS_KEY_ID=minioadmin
      - S3_COMPATIBLE_SECRET_ACCESS_KEY=minioadmin
      - S3_COMPATIBLE_USE_PATH_STYLE=true
      - S3_COMPATIBLE_DISABLE_SSL=true
      - S3_COMPATIBLE_PUBLIC_URL=http://localhost:9000
      # SMTP (Mailpit for local development)
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM_EMAIL=noreply@servicepro.local
      - SMTP_FROM_NAME=ServicePro
      # Stripe webhook secret file (written by stripe-cli service)
      - STRIPE_WEBHOOK_SECRET_FILE=/shared/stripe-webhook-secret
      # Error tracking (GlitchTip/Sentry)
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=development
      # PostHog Analytics
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
      - stripe_webhook_secret:/shared:ro
    command: go run ./cmd

  frontend:
    image: node:24-alpine
    container_name: servicepro-frontend
    working_dir: /app
    ports:
      - '3000:3000'
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=ws://localhost:8080/ws
      - VITE_PROXY_TARGET=http://backend:8080
      # Error tracking (GlitchTip/Sentry)
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
      - VITE_ENV=development
      # PostHog Analytics
      - VITE_POSTHOG_API_KEY=${VITE_POSTHOG_API_KEY:-}
      - VITE_POSTHOG_HOST=${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # Grafana for platform analytics (developer tool)
  # Access at http://localhost:3001 (admin/admin)
  # PostgreSQL data source and dashboards are auto-provisioned
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: servicepro-grafana
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

  # Stripe CLI for webhook forwarding (for payment testing)
  # Requires STRIPE_SECRET_KEY to be set in backend/.env
  stripe-cli:
    image: stripe/stripe-cli:v1.53.1
    container_name: servicepro-stripe-cli
    env_file:
      - ./backend/.env
    environment:
      - STRIPE_FORWARD_URL=http://backend:8080/api/v1/stripe/webhooks
    volumes:
      - ./scripts/stripe-listen.sh:/stripe-listen.sh:ro
      - stripe_webhook_secret:/shared
    depends_on:
      - backend
    entrypoint: /bin/sh
    command: /stripe-listen.sh
    restart: on-failure # Restart if STRIPE_SECRET_KEY is missing initially

volumes:
  postgres18_data:
  redis_data:
  minio_data:
  grafana_data:
  go-mod-cache:
  stripe_webhook_secret:
