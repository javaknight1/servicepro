# Scheduled background jobs.
#
# On Cloud Run the API runs no in-process tickers (RUN_BACKGROUND_WORKERS=false):
# CPU is throttled between requests and instances scale to zero, so hourly
# goroutine tickers would not fire reliably. Instead the API exposes each job as
#   POST /internal/jobs/<name>
# authenticated by the X-Internal-Jobs-Token header (= INTERNAL_JOBS_SECRET),
# and this workflow is the scheduler.
#
# LIVE since 2026-10-24: the repo variable API_URL points at the Cloud Run URL.
# If API_URL is unset, every run is a no-op — the job is skipped, never failed.
#
# Schedule (UTC):
#   hourly at :15   payment-reminders    unpaid-invoice reminder emails
#   hourly at :15   quote-expiry         sent quotes past valid_until -> expired
#   hourly at :15   agreement-visits     scheduled jobs for service-agreement visits,
#                                        next 14 days in each tenant's time zone
#                                        (idempotent: one claim per agreement+date)
#   hourly at :15   consolidated-invoices draft consolidated invoices for last month,
#                                        on the 1st in each tenant's time zone
#                                        (idempotent: one claim per customer+month)
#   hourly at :15   quickbooks-sync      push new/changed customers, invoices and
#                                        payments to each connected tenant's
#                                        QuickBooks Online (T192; no-op until the
#                                        Intuit keys are set; idempotent: per-tenant
#                                        lease, sync map, Intuit requestid)
#   :05/:20/:35/:50 imports              queued customer CSV imports (> 1,000 rows;
#                                        smaller files import during the upload)
# Add a job here only once the API exposes /internal/jobs/<name> for it.
#
# Missed or failed runs (T252): each job checks in to the Sentry cron monitor
# servicepro-<job> (project servicepro-api) through scripts/sentry-cron.sh;
# monitors are created on their first check-in from the config in monitor()
# below. Needs the SENTRY_CRONS_DSN secret; without it check-ins are skipped.
# See docs/ops/monitoring.md.
# GitHub may delay scheduled runs under load; the jobs must tolerate a late or
# skipped tick (they select by due-time, not "exactly now").
#
# Manual run: Actions -> "Scheduled jobs" -> Run workflow, pick a job or "all".
name: Scheduled jobs

on:
  schedule:
    - cron: '15 * * * *'
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        type: choice
        default: all
        options:
          - all
          - payment-reminders
          - quote-expiry
          - invoice-overdue
          - agreement-visits
          - consolidated-invoices
          - quickbooks-sync
          - imports

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read access for the sparse checkout of scripts/sentry-cron.sh only.
    permissions:
      contents: read
    env:
      API_URL: ${{ vars.API_URL }}
      JOBS_TOKEN: ${{ secrets.INTERNAL_JOBS_SECRET }}
      # Sentry cron monitors (T252): optional; check-ins are skipped without it.
      SENTRY_CRONS_DSN: ${{ secrets.SENTRY_CRONS_DSN }}
      EVENT: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
      INPUT_JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/sentry-cron.sh
          sparse-checkout-cone-mode: false
      - name: Run jobs
        run: |
          set -euo pipefail
          : "${JOBS_TOKEN:?INTERNAL_JOBS_SECRET secret is not set}"
          failed=0

          # monitor <job> — Sentry monitor config "crontab|margin|max-runtime|failures-before-issue"
          # (minutes). Margins are wide because GitHub often starts scheduled
          # runs 5-30 minutes late; the threshold keeps one late tick quiet.
          monitor() {
            case "$1" in
              imports) echo '5,20,35,50 * * * *|10|10|4' ;; # alert after ~1 h of misses/errors
              *)       echo '15 * * * *|45|10|2' ;;         # alert after 2 bad hours in a row
            esac
          }

          # post <job> — POST one job, log the result, record failure, and
          # check in to the job's Sentry cron monitor servicepro-<job>.
          post() {
            local job="$1" out code ok=1 checkin c_sched c_margin c_runtime c_threshold
            IFS='|' read -r c_sched c_margin c_runtime c_threshold <<<"$(monitor "$job")"
            checkin=$(scripts/sentry-cron.sh start "servicepro-${job}" "$c_sched" "$c_margin" "$c_runtime" "$c_threshold")
            if out=$(curl -sS -m 300 -w $'\n%{http_code}' -X POST \
                    -H "X-Internal-Jobs-Token: ${JOBS_TOKEN}" \
                    -H 'Content-Type: application/json' \
                    "${API_URL%/}/internal/jobs/${job}"); then
              code=$(tail -n1 <<<"$out"); out=$(sed '$d' <<<"$out")
              echo "${job} -> HTTP ${code} ${out}"
              echo "| \`${job}\` | ${code} | \`${out:0:200}\` |" >> "$GITHUB_STEP_SUMMARY"
              if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
                echo "::error::${job}: HTTP ${code}"; ok=0
              fi
            else
              echo "::error::${job}: request failed"; ok=0
            fi
            if [ "$ok" = 1 ]; then
              scripts/sentry-cron.sh finish "servicepro-${job}" "$checkin" ok
            else
              failed=1
              scripts/sentry-cron.sh finish "servicepro-${job}" "$checkin" error
            fi
          }

          echo "| job | status | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$INPUT_JOB" = "all" ]; then
              jobs="invoice-overdue payment-reminders quote-expiry agreement-visits consolidated-invoices quickbooks-sync imports"
            else
              jobs="$INPUT_JOB"
            fi
          elif [ "$SCHEDULE" = "15 * * * *" ]; then
            # Hourly tick: overdue marking, reminders, quote expiry and
            # agreement visits and consolidated invoices every hour.
            jobs="invoice-overdue payment-reminders quote-expiry agreement-visits consolidated-invoices quickbooks-sync"
          else
            # Quarter-hour tick: queued CSV imports. (Each tick wakes the Neon
            # compute; an idle run is one cheap UPDATE.)
            jobs="imports"
          fi

          echo "trigger=${EVENT} schedule=${SCHEDULE:-n/a} jobs=${jobs}"
          for j in $jobs; do post "$j"; done
          exit "$failed"
