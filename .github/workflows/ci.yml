name: CI

# Green-before-tag gate (RELEASING.md): lint, test and build on every PR and
# every push to master. This workflow deploys NOTHING — master is a staging
# line of commits, kept releasable. Production ships only from a v* tag, via
# release-deploy.yml.
#
# The `name:` above must stay exactly "CI": dependabot-automerge.yml listens
# for it by name (workflow_run), and a rename silently disables auto-merge.
#
# Actions minutes (OD-2): a private repo gets 2,000 free minutes a month, and a
# full run bills ~15. So docs-only pushes don't run CI at all, and the `changes`
# job below skips the jobs for areas a push or PR didn't touch. A manual or
# dependabot-automerge dispatch always runs everything — that is the release
# gate. A skipped job counts as passing, so auto-merge still sees CI succeed.
# Every job bills at least one minute, so related checks share a job
# (govulncheck runs inside go-lint) and docker-build runs only when the image
# inputs change (2026-10-19, ~3 minutes saved per Go push).

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'help/**'
      - 'training/**'
      - 'grafana/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'help/**'
      - 'training/**'
      - 'grafana/**'
  # Dispatchable so dependabot-automerge.yml can validate master after a
  # GITHUB_TOKEN merge — which, like a token-pushed tag, triggers nothing.
  workflow_dispatch:

# Least privilege: nothing here pushes, tags or comments.
permissions:
  contents: read

# Cancel superseded PR runs; let master runs finish so every commit that may
# be tagged has a complete CI result. The event name is part of the group:
# a group holds only one PENDING run, so a push to master would otherwise
# replace (cancel) the queued workflow_dispatch run that
# dependabot-automerge.yml waits on before tagging — which left v0.9.5
# bumped but never released (2026-10-29).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Which areas this push or PR touched, from the GitHub API (no checkout).
    # Anything outside backend/, frontend/ and the docs paths — .github/,
    # Makefile, scripts/, VERSION, root config — runs everything, as does a
    # file list the API can't give in full.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.areas.outputs.go }}
      frontend: ${{ steps.areas.outputs.frontend }}
      openapi: ${{ steps.areas.outputs.openapi }}
      integration: ${{ steps.areas.outputs.integration }}
      docker: ${{ steps.areas.outputs.docker }}
    steps:
      - id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          go=false frontend=false openapi=false integration=false docker=false all=false
          files=""
          case "$EVENT" in
            push)
              if [[ "$BEFORE" =~ ^0+$ ]] ||
                 ! files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename'); then
                all=true
              fi
              # compare lists at most 300 files.
              [ "$(grep -c . <<<"$files")" -ge 300 ] && all=true ;;
            pull_request)
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || all=true ;;
            *) all=true ;;
          esac

          while IFS= read -r f; do
            case "$f" in
              '') ;;
              *.md|docs/*|help/*|training/*|grafana/*) ;;
              backend/tests/integration/*) go=true; integration=true ;;
              backend/Dockerfile|backend/.dockerignore|backend/go.mod|backend/go.sum) go=true; docker=true ;;
              backend/*) go=true ;;
              frontend/src/types/api.generated.ts|frontend/package.json|frontend/package-lock.json)
                frontend=true; openapi=true ;;
              frontend/*) frontend=true ;;
              *) echo "runs everything: $f"; all=true ;;
            esac
          done <<<"$files"

          # A full run skips db-integration: it is broken and non-blocking (see that job).
          if [ "$all" = true ]; then go=true frontend=true openapi=true docker=true; fi
          [ "$go" = true ] && openapi=true
          {
            echo "go=$go"
            echo "frontend=$frontend"
            echo "openapi=$openapi"
            echo "integration=$integration"
            echo "docker=$docker"
          } | tee -a "$GITHUB_OUTPUT"

  go-lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          # Resolve the newest matching patch rather than the runner's
          # preinstalled Go — see the govulncheck note in go-lint.
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          # Keep in sync with GOLANGCI_LINT_VERSION in the root Makefile.
          version: v2.14.0
          args: --config .golangci.yml
      # govulncheck against the backend module (was its own go-vuln job; it
      # shares this job's setup to save a billed minute). Fails on any known
      # CVE in code actually reachable from the binary (call-graph analysis).
      #
      # `check-latest: true` on every setup-go step exists for this check:
      # without it setup-go accepts the runner's preinstalled Go, and most
      # findings are standard-library CVEs already fixed in a newer patch
      # release. NOTE: setup-go treats an exact `go 1.24.0` in go.mod as an
      # exact version, so backend/go.mod should carry a current patch (a
      # `toolchain` line or a bumped `go` directive) for this gate to track
      # patch releases.
      - name: Install govulncheck
        # GOTOOLCHAIN=auto for this step only: govulncheck@latest may need a
        # newer Go to BUILD. The scanner is a tool, not a dependency.
        env:
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        working-directory: backend
        run: govulncheck ./...

  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: servicepro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/servicepro_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/servicepro_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      ENV: test
      # Postgres-backed concurrency tests (payments, numbering, quote races)
      # create a fresh database per test on this server.
      SERVICEPRO_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Migrate test database
        working-directory: backend
        # Repository tests run against DATABASE_URL and need the schema.
        run: go run ./cmd/migrate up
      - name: Unit tests
        working-directory: backend
        # -skip Integration: suites that need the full stack run in
        # db-integration below (build tag `integration`).
        run: go test -race -timeout 5m ./... -skip Integration
      - name: Build
        working-directory: backend
        run: go build ./...

  db-integration:
    # Real-DB integration suite: backend/tests/integration (build tag
    # `integration`) against Postgres, Redis and Mailpit service containers.
    #
    # TODO(integration): NON-BLOCKING until the suite is repaired. Today it
    # does not compile — SetupTest lives in setup_test.go, which the api/ and
    # database/ packages cannot import — and once it does it still needs:
    #   - LocalStack (AWS S3/SES emulation, AWS_ENDPOINT_URL :4566) for the
    #     AWS mock (backend/tests/localstack/init-aws.sh);
    #   - a running API on API_BASE_URL for the api/ suite;
    #   - its migration loader updated for golang-migrate file names
    #     (it globs migrations/*.sql, which would also run *.down.sql).
    # When fixed, drop continue-on-error, add a localstack service and set
    # integration=true on full runs again in the `changes` job. Until then it
    # runs only when its own files change.
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: servicepro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/servicepro_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAILHOG_API: http://localhost:8025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Vet integration suite
        working-directory: backend
        run: go vet -tags=integration ./tests/integration/...
      - name: Database integration tests
        working-directory: backend
        run: go test -tags=integration -count=1 -timeout 10m ./tests/integration/database/...

  openapi-drift:
    # Regenerate the OpenAPI spec (swag, pinned to backend/go.mod) and the
    # frontend TypeScript types, and fail if either differs from what's
    # committed. Fix locally with `make docs` and commit the result.
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Regenerate API docs + types
        run: make docs
      - name: Fail on drift
        run: |
          if ! git diff --exit-code --stat -- backend/docs frontend/src/types/api.generated.ts; then
            echo "::error::OpenAPI artifacts are stale. Run 'make docs' and commit backend/docs and frontend/src/types/api.generated.ts."
            exit 1
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Typecheck
        working-directory: frontend
        run: npm run type-check
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run --passWithNoTests
      - name: Dead code
        working-directory: frontend
        run: npm run dead-code
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_APP_VERSION: ci
          VITE_ENV: ci
        run: npm run build
      - name: Bundle size
        working-directory: frontend
        run: npm run analyze:bundle -- --ci
      - name: Add bundle report to step summary
        if: always() && hashFiles('frontend/dist/bundle-size-report.md') != ''
        run: cat frontend/dist/bundle-size-report.md >> "$GITHUB_STEP_SUMMARY"
      # Fail on any high-or-critical advisory in what ships (production deps).
      # Triage: bump the direct parent of the vulnerable transitive, or
      # `npm audit fix` after reading the diff. Don't raise the threshold.
      - name: npm audit (high+, production deps)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  docker-build:
    # Build the production backend/Dockerfile on every PR/push so a broken
    # image surfaces here, not at release time when scripts/deploy-cloudrun.sh
    # builds the same file. push: false — no registry credentials needed.
    # Runs only when the image inputs change (Dockerfile, .dockerignore,
    # go.mod, go.sum) or on a full run: Go code is already compiled by go-test,
    # and new CVEs are caught by the weekly security-scan and dependabot runs.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build backend/Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: servicepro-api:scan
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Trivy image scan
        # CVE-2026-33634: trivy-action tags 0.0.1–0.34.2 were compromised in
        # the March 2026 tag-hijack incident and deleted. 0.35.0 is the first
        # immutable safe release — never pin below it.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: servicepro-api:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
