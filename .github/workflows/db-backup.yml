# Nightly production database backup to Cloudflare R2.
#
# NOT ACTIVATED YET (T209): production is Neon Postgres and
# MIGRATION_DATABASE_URL is set, so the job runs, but it fails until the R2
# bucket and the R2_* secrets below exist. Without MIGRATION_DATABASE_URL the
# job is skipped instead. See docs/ops/backups.md.
#
# Each run writes one pg_dump custom-format archive under YYYY/MM/DD/:
#   public.dump   schema + data of the app's own tables (what migrations own)
#                 plus the neon_auth schema (Neon Auth users, sessions, OAuth
#                 config — T158), so a restore keeps sign-ins working. The
#                 file name predates neon_auth and is kept for continuity.
#
# Retention is the bucket's job: give `servicepro-backups` a lifecycle rule
# (e.g. expire after 30 days). This workflow never deletes anything.
#
# Secrets:
#   MIGRATION_DATABASE_URL   session pooler / direct URL (port 5432). pg_dump
#                            needs a session; a transaction pooler drops it.
#   R2_ACCESS_KEY_ID /       an R2 API token scoped to servicepro-backups with
#   R2_SECRET_ACCESS_KEY     Object Read & Write.
#   CLOUDFLARE_ACCOUNT_ID    already set for the Workers deploy.
#
# A failed scheduled run emails the repo admin (GitHub's default).
name: Database backup

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC — 3–4am in US time zones
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.cfg.outputs.enabled }}
    steps:
      - id: cfg
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MIGRATION_DATABASE_URL is not set — no production database to back up yet."
          fi

  backup:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the newer default CRC checksum headers on some aws-cli
      # versions; only send them when an operation requires it.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: servicepro-backups
    steps:
      - name: Check configuration
        run: |
          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID secret is not set}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY secret is not set}"
          case "$DATABASE_URL" in
            *:6543/*) echo "::error::MIGRATION_DATABASE_URL points at a transaction pooler (6543); pg_dump needs the session pooler / direct URL (5432)"; exit 1 ;;
          esac

      # pg_dump must be at least the server's major version, and the runner's
      # preinstalled client may lag. Ask the server, then install that major.
      - name: Install matching pg_dump
        run: |
          set -euo pipefail
          major=$(psql "$DATABASE_URL" -At -c "select current_setting('server_version_num')::int / 10000")
          echo "server major version: ${major}"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${major}"
          echo "/usr/lib/postgresql/${major}/bin" >> "$GITHUB_PATH"

      - name: Dump
        run: |
          set -euo pipefail
          pg_dump --version
          mkdir -p out
          pg_dump "$DATABASE_URL" --format=custom --compress=9 \
            --schema=public --schema=neon_auth --no-owner --no-privileges \
            --file=out/public.dump
          # A truncated or corrupt archive fails here, not on the day it's needed.
          pg_restore --list out/public.dump >/dev/null
          echo "public.dump: $(du -h out/public.dump | cut -f1), $(pg_restore --list out/public.dump | grep -c ' TABLE DATA ') tables with data"

      - name: Upload to R2
        run: |
          set -euo pipefail
          prefix="$(date -u +%Y/%m/%d)"
          aws s3 cp out/public.dump "s3://${BUCKET}/${prefix}/public.dump" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          {
            echo "### Backup ${prefix}"
            echo '```'
            aws s3 ls "s3://${BUCKET}/${prefix}/" --endpoint-url "$R2_ENDPOINT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
