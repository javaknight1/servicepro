name: Deploy Release

# Deploy on version tags (e.g., v1.0.0)
on:
  push:
    tags:
      - 'v*'

# Cancel in-progress deployments
concurrency:
  group: deploy-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Extract version info
  version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

  # Test everything first
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Run tests
        working-directory: backend
        run: go test -v -race -timeout 5m ./... -skip "Integration"
      - name: Build
        working-directory: backend
        run: go build -o /dev/null ./cmd

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test -- --run --passWithNoTests
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://servicepro-api.fly.dev

      - name: Check bundle size
        working-directory: frontend
        run: npm run analyze:bundle -- --ci

      - name: Add bundle report to step summary
        if: always() && hashFiles('frontend/dist/bundle-size-report.md') != ''
        run: cat frontend/dist/bundle-size-report.md >> $GITHUB_STEP_SUMMARY

  # Deploy backend to Fly.io
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [version, test-backend]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: ./backend
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment
        run: |
          sleep 10
          curl -f https://servicepro-api.fly.dev/health

  # Deploy frontend to Cloudflare Pages
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [version, test-frontend, deploy-backend]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://servicepro-api.fly.dev' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_APP_ENV: production
          VITE_APP_VERSION: ${{ needs.version.outputs.version }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: servicepro
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # Create summary
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [version, deploy-backend, deploy-frontend]
    steps:
      - name: Summary
        run: |
          echo "## Release ${{ needs.version.outputs.version }} Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployments" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: https://servicepro-api.fly.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://servicepro.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Health Check" >> $GITHUB_STEP_SUMMARY
          echo "Run \`curl https://servicepro-api.fly.dev/health\` to verify" >> $GITHUB_STEP_SUMMARY
