# Dependabot — weekly dependency updates.
#
# One update day (Monday) for all ecosystems so the batch lands in a single
# triage block. Minor + patch updates are grouped per ecosystem; majors arrive
# as individual PRs. dependabot-automerge.yml merges every Dependabot PR once
# CI is green (majors included, 2026-10-29) and cuts a release.
#
# The commit-message prefixes (deps(go) / deps(npm) / deps(actions)) are part
# of the release contract: scripts/gh-release.sh filters `deps` out of the
# release notes, and scripts/bump-version.sh treats a deps-only range as a
# PATCH. Don't change them to fix:/feat:.
#
# Security updates: Dependabot alerts + security-fix PRs are enabled in the
# repo settings (2026-10-18). Those PRs open as soon as an advisory lands,
# outside this weekly schedule, and auto-merge the same way.
#
# Triage:
#   - any bump -> auto-merged when CI passes
#   - CI failing (usually a major with breaking changes) -> fix on the PR branch
#     or close it; nothing merges red
#   - an alert with no PR (a transitive dep its parent pins exactly, e.g.
#     undici under wrangler/miniflare) -> bump the direct parent by hand

version: 2
updates:
  # Go backend (backend/)
  - package-ecosystem: 'gomod'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    labels:
      - 'deps'
      - 'go'
    commit-message:
      prefix: 'deps(go)'
    groups:
      go-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Frontend + its Cloudflare Worker (frontend/, one package-lock.json)
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    labels:
      - 'deps'
      - 'npm'
    commit-message:
      prefix: 'deps(npm)'
    groups:
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions (.github/workflows)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    labels:
      - 'deps'
      - 'ci'
    commit-message:
      prefix: 'deps(actions)'
