apiVersion: 1
datasources:
  - name: ServicePro PostgreSQL
    type: postgres
    url: postgres:5432
    database: servicepro
    user: postgres
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
    secureJsonData:
      password: password
    isDefault: true
    editable: true
